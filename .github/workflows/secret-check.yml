name: Block database credential leaks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files without printing secrets
        shell: python
        run: |
          import pathlib, re, subprocess, sys
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          failures = []
          pattern = re.compile(r'postgres(?:ql)?://[^\s\x22\x27<>]+')
          placeholder = 'postgresql://USER:PASSWORD@HOST/DB?sslmode=require'
          for name in filter(None, files):
              path = pathlib.Path(name)
              if path.name == '.env' or (path.name.startswith('.env.') and path.name != '.env.example') or path.name == 'render.env':
                  failures.append(f'{name}: environment credentials file must not be tracked')
              try:
                  content = path.read_text(encoding='utf-8')
              except (UnicodeError, OSError):
                  continue
              for number, line in enumerate(content.splitlines(), 1):
                  for match in pattern.findall(line):
                      if '@' in match and match != placeholder:
                          failures.append(f'{name}:{number}: database connection string must be stored in environment secrets')
          for failure in failures:
              print(failure)
          if failures:
              sys.exit(1)
          print('No database credentials or private environment files in tracked source.')
